version: 2
updates:
  - package-ecosystem: npm
    directory: /
    ignore:
      # TypeScript 7 não é suportado por typescript-eslint (<6.1) nem pelo Angular 22 (>=6.0 <6.1).
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    schedule:
      interval: weekly
    groups:
      angular:
        patterns: ['@angular/*', '@angular-eslint/*', 'angular-eslint']
      tiptap:
        patterns: ['@tiptap/*', '@kelsoncm/*']
      dev-dependencies:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ['*']
