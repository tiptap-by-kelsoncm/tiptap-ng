name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Criar release e publicar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Conferir versão da tag
        run: |
          ROOT="v$(node -p "require('./package.json').version")"
          LIB="v$(node -p "require('./projects/tiptap-ng/package.json').version")"
          if [ "$ROOT" != "$GITHUB_REF_NAME" ] || [ "$LIB" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME difere das versões do package.json ($ROOT) e da biblioteca ($LIB)."
            exit 1
          fi
      - run: npm run build
      - run: npm pack ./dist/tiptap-ng
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: "*.tgz"
      # Trusted publishing only (OIDC, needs id-token: write and npm 11.5.1+), as configured on npmjs.com.
      - name: Atualizar o npm (trusted publishing)
        run: npm install -g npm@^11.5.1
      - name: Publicar no npm
        run: npm publish ./dist/tiptap-ng --provenance --access public
